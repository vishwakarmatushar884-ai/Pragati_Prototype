name: pragati-platform-prod

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: pragati-gateway
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pragati-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: pragati-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pragati_db}
      POSTGRES_USER: ${POSTGRES_USER:-pragati_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pragati_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pragati-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pragati_user} -d ${POSTGRES_DB:-pragati_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: pragati/ml-service:1.0.0
    container_name: pragati-ml-service
    restart: always
    volumes:
      - ml-models:/app/models
    networks:
      - pragati-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ml/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pragati/backend:1.0.0
    container_name: pragati-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pragati_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pragati_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pragati_password}
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    networks:
      - pragati-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pragati/frontend:1.0.0
    container_name: pragati-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pragati-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pragati-network:
    driver: bridge
    name: pragati-prod-network

volumes:
  pgdata:
    name: pragati_prod_pgdata
  ml-models:
    name: pragati_prod_ml_models
