version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pragati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pragati_db
      POSTGRES_USER: pragati_user
      POSTGRES_PASSWORD: pragati_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pragati_user -d pragati_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pragati-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ml/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pragati-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pragati_db
      SPRING_DATASOURCE_USERNAME: pragati_user
      SPRING_DATASOURCE_PASSWORD: pragati_password
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: PragatiSecretKeyForJwtTokenAuthenticationNationalInfraSecureProduction32BytesLong
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pragati-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  pgdata:
