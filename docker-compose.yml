name: pragati-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: pragati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pragati_db}
      POSTGRES_USER: ${POSTGRES_USER:-pragati_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pragati_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pragati-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pragati_user} -d ${POSTGRES_DB:-pragati_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: pragati/ml-service:1.0.0
    container_name: pragati-ml-service
    restart: unless-stopped
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ml-models:/app/models
    networks:
      - pragati-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ml/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pragati/backend:1.0.0
    container_name: pragati-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pragati_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pragati_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pragati_password}
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - pragati-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pragati/frontend:1.0.0
    container_name: pragati-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    networks:
      - pragati-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pragati-network:
    driver: bridge
    name: pragati-network

volumes:
  pgdata:
    name: pragati_pgdata
  ml-models:
    name: pragati_ml_models
