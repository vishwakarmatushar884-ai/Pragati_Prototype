# ==============================================================================
# PRAGATI Helm Chart Default Values
# ==============================================================================

global:
  environment: production
  imagePullPolicy: IfNotPresent

# Backend Service
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/pragati/backend
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

# Frontend Service
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/pragati/frontend
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# ML AI Microservice
mlService:
  replicaCount: 2
  image:
    repository: ghcr.io/pragati/ml-service
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# PostgreSQL Internal Database
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  database: pragati_db
  username: pragati_user
  password: "pragati_password_change_in_production"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Security & Secrets
secrets:
  jwtSecret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  jwtExpirationMs: 86400000

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  hosts:
    - host: pragati.gov.in
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /actuator
          pathType: Prefix
          service: backend
  tls:
    - secretName: pragati-tls-secret
      hosts:
        - pragati.gov.in
