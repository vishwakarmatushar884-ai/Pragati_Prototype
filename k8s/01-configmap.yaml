apiVersion: v1
kind: ConfigMap
metadata:
  name: pragati-config
  namespace: pragati
  labels:
    app.kubernetes.io/name: pragati
data:
  # General
  APP_ENV: "production"
  SPRING_PROFILES_ACTIVE: "prod"
  
  # Database Host & Name
  POSTGRES_HOST: "pragati-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "pragati_db"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pragati-postgres:5432/pragati_db"
  
  # Connection Pool
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "5"
  DB_POOL_TIMEOUT: "30000"
  
  # Services Connectivity
  ML_SERVICE_URL: "http://pragati-ml-service:8000"
  BACKEND_URL: "http://pragati-backend:8080"
  
  # Features & Security
  CORS_ALLOWED_ORIGINS: "*"
  APP_SEED_ENABLED: "true"
  JWT_EXPIRATION_MS: "86400000"
