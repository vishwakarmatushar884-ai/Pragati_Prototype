apiVersion: v1
kind: Service
metadata:
  name: pragati-ml-service
  namespace: pragati
  labels:
    app.kubernetes.io/name: pragati-ml-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: pragati-ml-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pragati-ml-service
  namespace: pragati
  labels:
    app.kubernetes.io/name: pragati-ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pragati-ml-service
  template:
    metadata:
      labels:
        app: pragati-ml-service
    spec:
      containers:
        - name: ml-service
          image: ghcr.io/pragati/ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /ml/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ml/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pragati-ml-hpa
  namespace: pragati
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pragati-ml-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
