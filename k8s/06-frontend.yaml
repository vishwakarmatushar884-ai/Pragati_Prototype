apiVersion: v1
kind: Service
metadata:
  name: pragati-frontend
  namespace: pragati
  labels:
    app.kubernetes.io/name: pragati-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: pragati-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pragati-frontend
  namespace: pragati
  labels:
    app.kubernetes.io/name: pragati-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pragati-frontend
  template:
    metadata:
      labels:
        app: pragati-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/pragati/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pragati-frontend-hpa
  namespace: pragati
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pragati-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
