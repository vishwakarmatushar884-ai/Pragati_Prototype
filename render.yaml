# ==============================================================================
# PRAGATI - Render Full-Stack Deployment Blueprint (render.yaml)
# ==============================================================================
# Deploys the entire platform (React Frontend + Spring Boot Backend + In-Memory Database)
# as a single unified Web Service on Render.
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pragati-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: APP_SEED_ENABLED
        value: "true"
