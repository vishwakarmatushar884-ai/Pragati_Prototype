# ==============================================================================
# PRAGATI - Render Deployment Blueprint (render.yaml)
# ==============================================================================
# Official Blueprint Specification for Render Static Site Deployment (Zero-Docker)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. PRAGATI Frontend Static Site
  - type: web
    name: pragati-portal
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
