# ==============================================================================
# PRAGATI - Render Deployment Blueprint (render.yaml)
# ==============================================================================
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pragati-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
